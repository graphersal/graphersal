[workspace]
resolver = "3"
members = [
    "crates/graphersal",
    "crates/graphersal-cli",
    "crates/graphersal-session",
    "crates/graphersal-storage-tests",
    "crates/graphersal-wasm",
    "bindings/py-graphersal",
]
# A bare `cargo build`/`test`/`check` leaves out the Python binding: its build needs a Python
# >= 3.10 (the macOS system python3 is 3.9) and its lib target is also named `graphersal`.
# `--workspace` and `-p py-graphersal` still include it; maturin builds it for Python.
default-members = [
    "crates/graphersal",
    "crates/graphersal-cli",
    "crates/graphersal-session",
    "crates/graphersal-storage-tests",
    "crates/graphersal-wasm",
]

[workspace.package]
version = "0.2.3"
authors = ["Aleksandr Dederer <aleks@graphersal.dev>"]
repository = "https://github.com/graphersal/graphersal"
homepage = "https://graphersal.dev"
license = "Apache-2.0"
edition = "2024"
# Measured with cargo-msrv: the library needs 1.87 (`is_multiple_of`, quick-xml), the CLI 1.88
# (`home` via rustyline).
rust-version = "1.88"

[profile.release]
# One codegen unit: with the default 16, adding unrelated code (e.g. the jpath valueMap/elementMap
# path keys) shifted cross-unit inlining and slowed pure-adjacency traversals by ~10 %.
codegen-units = 1
#debug = true

# The prebuilt `graphersal` CLI binaries attached to every GitHub Release (.github/workflows/
# binaries.yml): release code, whole-program LTO, symbols stripped. Never `panic = "abort"` here:
# a panic unwinding through a unit rolls it back first (`close_on_unwind`), and the CLI, the dev
# server and the Store rely on that to leave no half-applied change behind.
[profile.dist]
inherits = "release"
lto = "fat"
strip = true

# The browser playground's WebAssembly module (crates/graphersal-wasm, playground/build.sh):
# release code optimized for size ("z": 25% smaller gzipped than "s", ~30% slower), link-time optimized, panics abort (no unwinding tables).
[profile.wasm-release]
inherits = "release"
opt-level = "z"
lto = true
panic = "abort"

[workspace.dependencies]
# Internal workspace crates
graphersal = { path = "crates/graphersal", version = "0.2.3" }
graphersal-session = { path = "crates/graphersal-session", version = "0.2.3" }
graphersal-storage-tests = { path = "crates/graphersal-storage-tests", version = "0.2.3" }

# Core Graph & Algorithms
compact_str = { version = "0.10", features = ["serde"] }
indexmap = { version = "2.5", features = ["serde"] }
fnv = "1.0"
# `HashTable` for the id index (entries without keys); already in the tree via indexmap.
hashbrown = { version = "0.17", default-features = false }
rand = "0.8"
floating-duration = "0.1"
ordered-float = { version = "4.2", features = ["serde"] }
bitmask-enum = "2.2"
parking_lot = "0.12"
tracing = "0.1"
# `std::time::Instant` panics on wasm32-unknown-unknown; web-time is std's type elsewhere and a
# `performance.now()` clock in the browser (already in the tree through rhai).
web-time = "1"
thiserror = "1.0"
# IANA time zones of the temporal values (book "Dates and Times"): the zone rules and the bundled
# tz database (`jiff-tzdb`, the same answer on every machine and in wasm32, updated with our
# releases). Used internally only: calendar math, parsing and formatting are our own code and no
# jiff type appears in the public API. No system database lookup (`tzdb-zoneinfo` off) and no
# `js` feature: the clock is `web_time`.
jiff = { version = "0.2.37", default-features = false, features = ["std", "tz-fat", "tzdb-bundle-always"] }
# Schema `pattern` constraints are regular expressions (JSON Schema semantics). The de-facto
# standard engine: linear-time matching (no catastrophic backtracking on untrusted schemas), no
# unsafe FFI, builds for wasm32-unknown-unknown. A pattern is compiled once, when the schema
# field is built, never per value.
regex = "1"

# Entropy backends for wasm32-unknown-unknown (browser): enabled only for that target in the
# library, see crates/graphersal/Cargo.toml.
getrandom02 = { package = "getrandom", version = "0.2", features = ["js"] }
getrandom03 = { package = "getrandom", version = "0.3", features = ["wasm_js"] }

# Scripting & Parsing
rhai = { version = "1.20.0", features = ["internals", "decimal", "metadata"] }
quick-xml = "0.42"
tabled = "0.22"

# Persistence (`persist` feature: packed snapshots, journal, recovery; book/src/persistence/format.md).
# LZ4 block compression of snapshot chunks and large journal records: pure Rust, no unsafe in
# the default `safe-encode`/`safe-decode` mode, builds for wasm32; only the block format is used
# (no frame format, so no `twox-hash`).
lz4_flex = { version = "0.14", default-features = false, features = ["std", "safe-encode", "safe-decode", "checked-decode"] }
# CRC-32C (Castagnoli), the checksum of every chunk, record and header (format spec section 2):
# hardware accelerated on x86_64 (SSE 4.2) and aarch64 (CRC extension), table-driven software
# fallback elsewhere (wasm32), pure Rust.
crc32c = "0.6"
# The Store's directory lock (`persist`, native only): one writer per store directory through the
# OS's advisory lock (`flock` on Unix, `LockFileEx` on Windows), released by the OS when the
# process ends, also on a crash. Pure Rust (rustix / windows-sys, both already in the tree through
# rustyline, as fd-lock itself is). `std::fs::File::lock` needs Rust 1.89, above the MSRV.
fd-lock = "4"
# The free disk space of a single-file store's file system (`statvfs`, Unix), for the
# compaction advice. Already in the tree through fd-lock (the same version and features).
rustix = { version = "1", features = ["fs"] }
# zstd chunks (codec 2, `persist-zstd` feature): the pure-Rust zstd encoder and decoder (no C
# library), builds for wasm32.
ruzstd = { version = "0.9.1", default-features = false, features = ["std"] }

# The Model2Vec embedder (`graphersal` feature `model2vec`, `graphersal::vector::Model2Vec`,
# native only): static token embeddings + mean pooling from a local model directory
# (`config.json`, `tokenizer.json`, `model.safetensors`). `model2vec-rs` (MIT) is the reference
# implementation of the format by its authors; without default features it has no
# `hf-hub`/`ureq` 2 and never touches the network (the CLI's `embed-model download` fetches the
# files). `tokenizers` (Apache-2.0) is the Hugging Face tokenizer `model2vec-rs` builds on; it
# needs one regex backend: `fancy-regex` is pure Rust (the default `onig` and `esaxx_fast` build
# C/C++ code). `safetensors` (Apache-2.0, already a dependency of `model2vec-rs`) reads the
# shape of the embedding matrix at load, so a vocabulary id that is out of range is refused there
# and no lookup can go out of bounds later.
model2vec-rs = { version = "0.3.0", default-features = false }
tokenizers = { version = "0.21", default-features = false, features = ["fancy-regex"] }
safetensors = "0.5"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# CLI & REPL
rustyline = "14.0"
rustyline-derive = "0.10"
# The dev server of the CLI (`graphersal --server`, feature `dev-server`): a small, synchronous,
# pure-Rust HTTP/1.1 server without an async runtime (4 small dependencies); a local DEV
# endpoint needs no more.
tiny_http = "0.12"
# The AI Chat of the dev server (`graphersal --server --ai FILE`, CLI feature `ai`): the LLM provider
# calls over HTTPS. Synchronous (no async runtime: the dev server is synchronous, the Rust LLM
# SDKs need tokio), pure Rust with rustls (ring) and the webpki root certificates, no system TLS.
ureq = { version = "3.4", default-features = false, features = ["rustls"] }
# SHA-256 of the files `graphersal embed-model download` fetches (CLI feature `model2vec`), checked
# against the hash Hugging Face states for an LFS file while the body streams to disk. Already in
# the tree as the crypto provider of rustls (through `ureq`), the same version: no new crate.
ring = "0.17"
# SIGINT/SIGTERM (Ctrl+C, `kill`) in the CLI and its dev server: a Store open in the process is
# closed cleanly before it exits (a second Ctrl+C exits at once). Small and pure Rust (a signal
# pipe on Unix through `nix`, a console handler on Windows); `termination` adds SIGTERM/SIGHUP.
# std has no portable signal API, and a hand-written `libc::signal` handler could not do the
# close outside the signal context safely.
ctrlc = { version = "3.4", features = ["termination"] }

# WebAssembly (crates/graphersal-wasm). Pinned exactly: the wasm-bindgen CLI that generates the
# JS glue must have the same version (`cargo install --locked wasm-bindgen-cli --version 0.2.129`).
wasm-bindgen = "=0.2.129"
wasm-bindgen-test = "=0.3.79"

# Python bindings (bindings/py-graphersal)
pyo3 = "0.29"
uuid = "1.10"

# Benchmarking
divan = "0.1.14"
