name: Python wheels

# Builds abi3 wheels (one wheel per platform covers Python 3.10+) and the sdist, and runs the
# binding's tests. Manual only (a project decision: Actions minutes are limited):
# `gh workflow run "Python wheels"` runs the binding's tests (Python 3.10 and 3.13); with
# `-f wheels=true` it also builds the four-platform wheels (one of them on macOS, whose minutes
# count x10 on a private repository), checks that each installs and imports where it can run,
# and builds the sdist. release.yml calls it (`workflow_call`) and publishes the artifacts
# `python-dist-*`.
# Wheels are uploaded as workflow artifacts only. Publishing to PyPI is a later, manual decision:
# use PyPI Trusted Publishing (OIDC, `pypa/gh-action-pypi-publish`, `permissions: id-token: write`)
# in a separate release workflow; no token is stored in this repository.

on:
  workflow_dispatch:
    inputs:
      wheels:
        description: "Also build the wheels for the four platforms and the sdist"
        type: boolean
        default: false
  workflow_call:
    inputs:
      wheels:
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  wheels:
    name: wheel (${{ matrix.name }})
    if: inputs.wheels
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # `smoke`: the runner can run the wheel (not the cross-built linux-aarch64 one).
          - { name: linux-x86_64, os: ubuntu-latest, target: x86_64, manylinux: auto, smoke: true }
          - { name: linux-aarch64, os: ubuntu-latest, target: aarch64, manylinux: auto, smoke: false }
          - { name: macos-arm64, os: macos-latest, target: aarch64, manylinux: auto, smoke: true }
          - { name: windows-x86_64, os: windows-latest, target: x64, manylinux: auto, smoke: true }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: PyO3/maturin-action@v1
        with:
          working-directory: bindings/py-graphersal
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          args: --release --out dist
      - name: The wheel installs and runs
        if: matrix.smoke
        shell: bash
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/smoke"
          py="$RUNNER_TEMP/smoke/bin/python"
          [ -e "$py" ] || py="$RUNNER_TEMP/smoke/Scripts/python"   # Windows
          "$py" -m pip install bindings/py-graphersal/dist/*.whl
          "$py" -c 'import graphersal; g = graphersal.Graph.tinkerpop_modern(); assert g.query("g.V().count().next()") == 6'
      - uses: actions/upload-artifact@v4
        with:
          name: python-dist-${{ matrix.name }}
          path: bindings/py-graphersal/dist

  sdist:
    if: inputs.wheels
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          working-directory: bindings/py-graphersal
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: python-dist-sdist
          path: bindings/py-graphersal/dist

  test:
    # The binding's tests on the oldest and the newest supported Python (abi3-py310: one wheel
    # covers 3.10+): pytest against a `maturin develop` build, then the crate's Rust tests with
    # PYO3_PYTHON pointing at the same interpreter (CLAUDE.md).
    name: test (python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: py${{ matrix.python }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build and test
        working-directory: bindings/py-graphersal
        run: |
          python -m venv .venv
          . .venv/bin/activate
          pip install maturin pytest
          maturin develop
          python -m pytest tests/
      - name: Rust tests of the binding
        run: PYO3_PYTHON="$PWD/bindings/py-graphersal/.venv/bin/python" cargo test --package py-graphersal
