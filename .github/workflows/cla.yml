name: CLA

# Every author of a pull request must accept the Contributor License Agreement (CLA.md) once, by
# posting the sign comment the check asks for (see CONTRIBUTING.md). Signatures are kept as JSON on
# the branch `cla-signatures` of this repository. `pull_request_target` runs this workflow from
# `main` with a write token; it never checks out or runs the pull request's code.

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    steps:
      - name: CLA check
        if: >-
          github.event_name == 'pull_request_target' ||
          github.event.comment.body == 'recheck' ||
          github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'
        # v2.6.1, pinned by commit: the action runs with a write token.
        uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-document: https://github.com/graphersal/graphersal/blob/main/CLA.md
          path-to-signatures: signatures/version1/cla.json
          branch: cla-signatures
          allowlist: Dederer-A,dependabot[bot],github-actions[bot]
          lock-pullrequest-aftermerge: false
