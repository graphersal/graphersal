name: Release

# Publishes the Python package `graphersal` to PyPI: the four-platform wheels and the sdist built
# by python.yml (which also runs the binding's tests), uploaded through PyPI Trusted Publishing
# (OIDC: no token in this repository; PyPI trusts this file, `release.yml`, in the environment
# `pypi`). Builds the four-platform `graphersal` CLI archives through binaries.yml (smoke-tested,
# SHA256SUMS, build provenance attestations) and creates a DRAFT GitHub Release for the tag with
# them attached; its text is the version's release notes of the book
# (`book/src/release_notes/release_notes_<version>.md`, links made absolute on graphersal.dev by
# `.github/scripts/release_notes.py`). The maintainer checks the draft and publishes it by hand.
# The crates go to crates.io by hand (`cargo publish`, graphersal first).
#
# Manual only, on a release tag:  gh workflow run Release --ref v0.1.0
# The tag must equal the workspace version (`version` in the root Cargo.toml).

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: release tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: The ref is a tag v<version> of the workspace version
        run: |
          set -euo pipefail
          case "$GITHUB_REF" in
            refs/tags/v*) ;;
            *) echo "::error::Start the release on a tag: gh workflow run Release --ref v<version>"; exit 1 ;;
          esac
          tag="${GITHUB_REF#refs/tags/v}"
          version="$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"$/\1/p' Cargo.toml)"
          if [ "$tag" != "$version" ]; then
            echo "::error::The tag v$tag does not match the workspace version $version"
            exit 1
          fi
          echo "Releasing $version"
          notes="book/src/release_notes/release_notes_$version.md"
          test -f "$notes" || { echo "::error::$notes (the release text) is missing"; exit 1; }

  build:
    needs: check
    uses: ./.github/workflows/python.yml
    with:
      wheels: true

  pypi:
    name: publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/graphersal/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: python-dist-*
          path: dist
          merge-multiple: true
      - name: Five files (four wheels and the sdist)
        run: |
          ls -l dist
          test "$(find dist -type f | wc -l)" -eq 4
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/

  binaries:
    needs: check
    uses: ./.github/workflows/binaries.yml
    permissions:
      contents: read
      id-token: write
      attestations: write
    with:
      attest: true

  github-release:
    name: draft GitHub Release
    needs: binaries
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: binaries-*
          path: dist
          merge-multiple: true
      - name: Four archives and SHA256SUMS
        run: |
          set -euo pipefail
          cd dist
          ls -l
          test "$(find . -maxdepth 1 \( -name 'graphersal-v*-*.tar.gz' -o -name 'graphersal-v*-*.zip' \) | wc -l)" -eq 4
          sha256sum -c SHA256SUMS
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF#refs/tags/}"
          version="${tag#v}"
          python3 .github/scripts/release_notes.py "$version" > "$RUNNER_TEMP/notes.md"
          gh release create "$tag" --draft --verify-tag \
            --title "Graphersal $version" --notes-file "$RUNNER_TEMP/notes.md" \
            dist/graphersal-v* dist/SHA256SUMS
